<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Contacts Hub</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="boot" class="boot"><div class="boot-card"><p>Loading…</p></div></div>

  <div class="app" id="app" hidden>
    <aside class="sidebar" id="sidebar">
      <a class="sb-brand" href="#/home">
        <span class="logo">CH</span>
        <span class="sb-brand-text">Contacts Hub</span>
      </a>
      <div class="nav-label">WORKSPACE</div>
      <nav class="nav" id="nav">
        <a data-route="home" href="#/home"><i><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></i><span>Home</span></a>
        <a data-route="vendors" href="#/vendors"><i><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></i><span>Vendor Directory</span></a>
        <a data-route="news" href="#/news"><i><svg viewBox="0 0 24 24"><path d="M4 4h13a2 2 0 012 2v14H6a2 2 0 01-2-2z"/><path d="M8 9h7M8 13h7M8 17h4"/></svg></i><span>News &amp; Updates</span> <b class="badge" id="badge-news" hidden></b></a>
        <a data-route="policy" href="#/policy"><i><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></i><span>Work Policy</span> <b class="badge" id="badge-policy" hidden></b></a>
      </nav>
      <div id="admin-nav" hidden>
        <div class="nav-label">ADMINISTRATION</div>
        <nav class="nav">
          <a data-route="admin-approvals" href="#/admin/approvals"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg></i><span>Approvals</span> <b class="badge" id="badge-admin" hidden></b></a>
          <a data-route="admin-members" href="#/admin/members"><i><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.8a3.5 3.5 0 010 6.4M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/></svg></i><span>Members</span></a>
          <a data-route="admin-categories" href="#/admin/categories"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg></i><span>Categories</span></a>
          <a data-route="admin-backup" href="#/admin/backup"><i><svg viewBox="0 0 24 24"><path d="M12 3v12M7 11l5 5 5-5M4 20h16"/></svg></i><span>Backup</span></a>
        </nav>
      </div>
      <div class="sb-bottom">
        <span class="avatar" id="sb-avatar">?</span>
        <div class="sb-user"><b id="sb-name"></b><small id="sb-role"></small></div>
        <button type="button" id="logout" class="logout" title="Log out" aria-label="Log out">↪</button>
      </div>
    </aside>
    <div class="sb-backdrop" id="sb-backdrop"></div>

    <div class="main">
      <header class="topbar">
        <button type="button" class="menu-btn" id="menu-btn" aria-label="Menu">☰</button>
        <form class="gsearch" id="gsearch" role="search">
          <span>⌕</span>
          <input id="gsearch-input" type="search" placeholder="Search vendors…" autocomplete="off" />
        </form>
        <div class="top-user"><span class="avatar tiny" id="top-avatar">?</span><b id="user-label"></b></div>
      </header>
      <div class="banner" id="banner" hidden></div>
      <main class="page" id="view"></main>
      <footer class="foot">Contacts Hub · Trusted vendors · Shared news · Work better together</footer>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/util.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/vendors.js"></script>
  <script src="js/news.js"></script>
  <script src="js/home.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
