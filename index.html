<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Company Contacts Hub</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="boot" class="boot"><div class="boot-card"><p>Loading…</p></div></div>

  <div class="app" id="app" hidden>
    <aside class="sidebar" id="sidebar">
      <a class="sb-brand" href="#/home">
        <span class="logo">CH</span>
        <span class="sb-brand-text">Company<br>Contacts Hub</span>
      </a>
      <div class="nav-label">WORKSPACE</div>
      <nav class="nav" id="nav">
        <a data-route="home" href="#/home"><i>⌂</i><span>Home</span></a>
        <a data-route="vendors" href="#/vendors"><i>▦</i><span>Vendor Directory</span></a>
        <a data-route="news" href="#/news"><i>▤</i><span>News &amp; Updates</span> <b class="badge" id="badge-news" hidden></b></a>
        <a data-route="policy" href="#/policy"><i>▣</i><span>Work Policy</span> <b class="badge" id="badge-policy" hidden></b></a>
      </nav>
      <div id="admin-nav" hidden>
        <div class="nav-label">ADMINISTRATION</div>
        <nav class="nav">
          <a data-route="admin-approvals" href="#/admin/approvals"><i>✔</i><span>Approvals</span> <b class="badge" id="badge-admin" hidden></b></a>
          <a data-route="admin-members" href="#/admin/members"><i>♙</i><span>Members</span></a>
          <a data-route="admin-categories" href="#/admin/categories"><i>⚙</i><span>Categories</span></a>
          <a data-route="admin-backup" href="#/admin/backup"><i>⇩</i><span>Backup</span></a>
        </nav>
      </div>
      <div class="sb-bottom">
        <span class="avatar" id="sb-avatar">?</span>
        <div class="sb-user"><b id="sb-name"></b><small id="sb-role"></small></div>
        <button type="button" id="logout" class="logout" title="Log out" aria-label="Log out">↪</button>
      </div>
    </aside>
    <div class="sb-backdrop" id="sb-backdrop"></div>

    <div class="main">
      <header class="topbar">
        <button type="button" class="menu-btn" id="menu-btn" aria-label="Menu">☰</button>
        <form class="gsearch" id="gsearch" role="search">
          <span>⌕</span>
          <input id="gsearch-input" type="search" placeholder="Search vendors…" autocomplete="off" />
        </form>
        <div class="top-user"><span class="avatar tiny" id="top-avatar">?</span><b id="user-label"></b></div>
      </header>
      <div class="banner" id="banner" hidden></div>
      <main class="page" id="view"></main>
      <footer class="foot">Company Contacts Hub · Trusted vendors · Shared news · Work better together</footer>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/util.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/vendors.js"></script>
  <script src="js/news.js"></script>
  <script src="js/home.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
