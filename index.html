<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Company Contacts Hub</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="boot" class="boot"><div class="boot-card"><p>Loading…</p></div></div>

  <header class="topbar" id="topbar" hidden>
    <div class="topbar-inner">
      <a class="brand" href="#/vendors">
        <span class="brand-name" id="brand-name">COMPANY CONTACTS HUB</span>
        <span class="brand-sub" id="brand-sub"></span>
      </a>
      <nav class="tabs" id="tabs">
        <a data-route="vendors" href="#/vendors">Vendors</a>
        <a data-route="news" href="#/news">News &amp; Policy <span class="badge" id="badge-news" hidden></span></a>
        <a data-route="admin" href="#/admin" id="tab-admin" hidden>Admin <span class="badge" id="badge-admin" hidden></span></a>
      </nav>
      <div class="userbox">
        <span id="user-label"></span>
        <button type="button" id="logout" class="link-btn light">Log out</button>
      </div>
    </div>
  </header>
  <div class="banner" id="banner" hidden></div>

  <main class="page" id="view"></main>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/util.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/vendors.js"></script>
  <script src="js/news.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
